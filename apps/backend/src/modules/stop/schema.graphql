type StopEntrance {
    id: ID!
    name: String!
    latitude: Float!
    longitude: Float!
}

type Stop {
    id: ID!
    name: String!
    avgLatitude: Float!
    avgLongitude: Float!
    entrances: [StopEntrance!]!
    platforms: [Platform!]!
}

type Query {
    stops(ids: [ID!], feed: Feed, limit: Int, offset: Int): [Stop!]!
    stop(id: ID!): Stop
    searchStops(query: String!, feed: Feed, limit: Int, offset: Int): [Stop!]!
    stopDataLastUpdatedAt: ISODateTime
}
